name: Analytics Update
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'analytics/**'

# Une seule mise à jour à la fois : si deux déclenchements tombent ensemble,
# le second attend la fin du premier au lieu de se télescoper avec lui
concurrency:
  group: analytics-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node script-analytics.js
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
      - run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add analytics/
          git commit -m "Update analytics" || true
          git pull --rebase origin main
          git push

      # Les envois faits par le robot GitHub ne relancent pas la publication du site.
      # On la demande explicitement, sinon le tableau de bord garde l'ancien stats.json.
      - name: Publier le site
        continue-on-error: true
        run: gh api -X POST repos/${{ github.repository }}/pages/builds
        env:
          GH_TOKEN: ${{ github.token }}
